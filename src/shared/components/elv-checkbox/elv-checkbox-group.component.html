<!--
  <fieldset> + <legend> is the whole accessibility story here: it is the one
  grouping mechanism screen readers announce when focus ENTERS the set, so
  each row is read as "<legend> — <label>, checkbox, checked" with no
  aria-labelledby wiring. The fieldset's default border/margin/padding are
  reset in the stylesheet; the element is here for semantics, not looks.
-->
<fieldset class="cbg__set" [attr.aria-invalid]="invalid() || null" [attr.aria-describedby]="message() ? msgId : null">
    @if (label()) {
        <legend class="cbg__legend" [id]="legendId">
            {{ label() }}
            @if (required()) {
                <span class="cbg__req" aria-hidden="true">*</span>
            }
        </legend>
    }

    <div class="cbg__rows">
        @for (opt of options(); track opt.value) {
            <elv-checkbox
                [label]="opt.label"
                [hint]="opt.hint ?? ''"
                [checked]="isSelected(opt.value)"
                [disabled]="isRowDisabled(opt)"
                [readonly]="readonly()"
                [size]="size()"
                [skin]="skin()"
                [corner]="corner()"
                [tone]="tone()"
                [labelPosition]="labelPosition()"
                (change)="onToggle(opt.value, $event)" />
        }
    </div>

    @if (message(); as m) {
        <p
            class="cbg__msg"
            [class.cbg__msg--err]="showAsError()"
            [id]="msgId"
            [attr.role]="showAsError() ? 'alert' : null"
            [attr.aria-live]="showAsError() ? null : 'polite'">
            @if (showAsError()) {
                <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
            }
            <span>{{ m }}</span>
        </p>
    }
</fieldset>
