<div [class]="classes" [style.--_accent]="accentColor || null">

  @if (label) {
    <div class="elv-stats__header">
      <span class="elv-stats__header-text">{{ label }}</span>
    </div>
  }

  <div class="elv-stats__grid">
    @for (s of stats; track $index) {
      <div class="elv-stats__item">

        @if (s.icon) {
          <span class="elv-stats__icon" aria-hidden="true"><i [class]="s.icon"></i></span>
        }

        <div class="elv-stats__value font-bold">{{ s.value }}</div>
        <div class="elv-stats__label font-mono uppercase">{{ s.label }}</div>

      </div>
    }
  </div>

</div>
