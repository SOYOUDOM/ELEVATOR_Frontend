<section class="wsf__panel">

  @if (title() || subtitle()) {
    <header class="wsf__head" [class.wsf__head--center]="centered()">
      @if (title()) {
        <h3 class="wsf__title">{{ title() }}</h3>
      }
      @if (subtitle()) {
        <p class="wsf__subtitle">{{ subtitle() }}</p>
      }
    </header>
  }

  <div class="wsf__body">
    <ng-content />
  </div>

  @if (hasFooter) {
    <footer class="wsf__foot">
      @if (footnote()) {
        <p class="wsf__footnote">{{ footnote() }}</p>
      }

      <div class="wsf__nav">
        <div class="wsf__nav-left">
          @if (showBack()) {
            <app-elv-button
              variant="ghost"
              corner="sharp"
              icon="pi pi-arrow-left"
              [title]="backLabel()"
              (clicked)="back.emit()" />
          }
        </div>

        <div class="wsf__nav-right">
          @if (showSkip()) {
            <app-elv-button
              variant="link"
              corner="sharp"
              [title]="skipLabel()"
              (clicked)="skip.emit()" />
          }
          @if (showContinue()) {
            <app-elv-button
              variant="neon"
              corner="sharp"
              [glow]="true"
              icon="pi pi-arrow-right"
              iconPos="right"
              [iconGap]="18"
              [title]="continueLabel()"
              [disabled]="continueDisabled()"
              (clicked)="continue.emit()" />
          }
        </div>
      </div>
    </footer>
  }
</section>
