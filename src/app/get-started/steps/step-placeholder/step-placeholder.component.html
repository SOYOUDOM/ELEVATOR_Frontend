<app-wizard-step-frame
  [title]="step().title"
  [subtitle]="step().subtitle"
  [showBack]="!wizard.isFirst()"
  [showSkip]="step().optional && !wizard.isLast()"
  [showContinue]="!wizard.isLast()"
  [continueLabel]="continueLabel()"
  [footnote]="footnote()"
  (back)="wizard.previous()"
  (skip)="wizard.skip()"
  (continue)="wizard.next()">

  <div class="sp__body">
    <span class="sp__icon" aria-hidden="true">
      <i class="{{ step().icon }}"></i>
    </span>

    <p class="sp__note">
      This floor is under construction. The stepper, the draft and the
      navigation are already live &mdash; the form for
      <strong>{{ step().label }}</strong> lands here next.
    </p>

    <span class="sp__tag elv-mono">Step {{ wizard.activeIndex() + 1 }} of {{ wizard.steps.length }}</span>
  </div>
</app-wizard-step-frame>
