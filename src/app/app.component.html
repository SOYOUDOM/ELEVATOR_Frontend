<div class="wrapper !max-w-none !mx-0 !px-0 w-full elv-shell elv-page">
elv-page
  <app-header></app-header>

  <aside
    id="app-sidebar"
    class="fixed top-0 left-0 h-screen w-64 z-40
           transform transition-transform duration-300 ease-in-out
           lg:hidden"
    [class.-translate-x-full]="!sidebarExpanded"
    [class.translate-x-0]="sidebarExpanded">
    <sidebar></sidebar>
  </aside>

  <div
    *ngIf="sidebarExpanded"
    (click)="toggleSidebar()"
    class="fixed inset-0 bg-black/45 z-30 lg:hidden">
  </div>

  <div class="route-shell" [attr.data-route-key]="routeKey">
    <div class="elv-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
