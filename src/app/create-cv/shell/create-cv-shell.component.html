<!-- ────────────────────────────────────────────────────────────
     Builder shell. Full-screen, outside the AdminLTE layout.

     The step track lives in the HEADER (not a side rail): it is
     wayfinding for the whole flow, while the per-floor rail in
     the page body carries status detail.

     Content wrapper is .elv-content — never `content-wrapper`,
     which AdminLTE hooks with a margin-left.
     ──────────────────────────────────────────────────────────── -->
<app-fx-grain />

<div class="elv-create__backdrop" aria-hidden="true"></div>

<header class="elv-create__header">
  <button type="button" class="elv-create__brand" (click)="exit()">
    <span class="elv-create__brand-mark">E</span><span>LEVATOR</span>
  </button>

  @if (wizard.onWizardFloor()) {
    <nav class="elv-create__track" aria-label="Builder steps">
      @for (s of wizard.stepperItems(); track s.id; let i = $index) {
        @if (!$first) {
          <span class="elv-create__track-rule" aria-hidden="true"></span>
        }
        <button
          type="button"
          class="elv-create__track-step"
          [attr.data-state]="trackState(s.id, i)"
          [attr.aria-current]="s.id === wizard.activeId() ? 'step' : null"
          (click)="goTo(s.id)">
          <span class="elv-create__track-num">{{ pad(i + 1) }}</span>
          <span class="elv-create__track-label">{{ s.label }}</span>
        </button>
      }
    </nav>
  }

  <div class="elv-create__header-right">
    <span class="elv-create__save" [attr.data-state]="store.saveState()" role="status" aria-live="polite">
      {{ saveText() }}
    </span>

    <app-elv-button
      variant="ghost"
      size="small"
      corner="sharp"
      icon="pi pi-save"
      [iconGap]="10"
      title="Save & exit"
      (clicked)="exit()" />
  </div>
</header>

<main class="elv-content">
  <router-outlet />
</main>

<div class="elv-create__footer">
  <app-footer />
</div>
