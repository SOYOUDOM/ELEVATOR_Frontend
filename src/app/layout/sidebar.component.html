<aside
    class="main-sidebar z-20! bg-[var(--p-surface-900)] elevation-4 w-[400px]! flex! flex-col h-screen pt-[22px] px-[24px] pb-[22px] mt-[20px]">

    <!-- ===== Close ===== -->
    <button type="button" class="elv-close" (click)="closeSidebar()" aria-label="Close menu">
        <i class="fas fa-xmark" aria-hidden="true"></i>
    </button>

    <!-- ===== Navigation ===== -->
    <nav class="flex-1 overflow-y-auto min-h-0 -mx-[2px] px-[2px]">
        @for (item of navItems; track item.label) {
        <a class="elv-item" [class.is-active]="item.label === activeLabel" (click)="go(item)">
            <i [class]="item.icon" aria-hidden="true"></i>
            <span>{{ item.label }}</span>
        </a>
        }
    </nav>

    <div class="getstarted flex flex-col gap-[clamp(2rem,1.2vh,0.5rem)] mt-1 w-full shrink-0 mb-3
            rounded-[15px]
            p-[clamp(2rem,5vh,0.75rem)]
            justify-center items-center text-[var(--p-elevator-ink)]
            text-[clamp(0.8rem,1.6vh,0.9rem)] leading-none uppercase ">
            <span class="text-center font-bold text-[clamp(0.8rem,1.6vh,0.9rem)] leading-none w-full h-auto">
                Start building your future now.
            </span>
            <app-elv-button [variant]="'ghost'" [brackets]="true"  title="GetStarted"></app-elv-button>
    </div>

  <app-elv-button [size]="'large'"  customClass="w-full!" [corner]="'round'" [fillColor]="'none'" [icon]="'fa-utility fa-semibold fa-angle-right'"
    [title]="'Sign in'" class="flex divide-x divide-gray-300 mb-2">
  </app-elv-button>
<!-- Infos -->
<span class="text-[var(--p-elevator-ink)] border-t border-[var(--p-elevator-accent-glow)] pl-3 w-full p-2">Hope this fruitfull blessing you.<br>.<br>.<br>.<br>.<br>.<br>.<br>.<br></span>

</aside>
