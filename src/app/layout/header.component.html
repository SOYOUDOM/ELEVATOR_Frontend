<!-- No backdrop-blur: a blur on a FIXED bar re-filters the content scrolling
     underneath it every frame, which measured ~10ms per frame on this page.
     Over a near-black palette the glass showed almost nothing anyway — a
     96%-opaque bar hides what was behind it more cleanly than a smear. Put
     `backdrop-blur-md` back and drop the alpha to /30 if you want the glass. -->
<div class="fixed top-0 inset-x-0 z-50 flex items-center justify-between
            h-[var(--p-elevator-navbar-height)] px-6 sm:px-12
            border-b border-[var(--p-elevator-line-soft)]
            bg-[color-mix(in_oklch,var(--p-elevator-bg0)_96%,transparent)]">

  <!-- LEFT: hamburger (mobile) + logo -->
  <div class="flex items-center shrink-0">
    <header-left-navbar></header-left-navbar>
  </div>

  <!-- NAV: desktop only -->
  <div class="flex items-center gap-8 shrink-0 max-mobile:hidden">
    @for (item of menuItems; track item.route) {
      <a [routerLink]="[item.route]"
         routerLinkActive="nav-link--active"
         [class.nav-link--cta]="item.isActive"
         class="nav-link">
        {{ item.label | localize }}
      </a>
    }
  </div>

  <span class="nav-saber" aria-hidden="true"></span>
</div>
