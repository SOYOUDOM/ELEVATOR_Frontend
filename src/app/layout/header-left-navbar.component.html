<div class="group flex items-center" [attr.data-open]="sidebarExpanded ? 'true' : 'false'">
    <!-- Hamburger toggle — mobile/tablet only -->
    <button
        type="button"
        (click)="toggleSidebar()"
        [attr.aria-label]="sidebarExpanded ? 'Close menu' : 'Open menu'"
        [attr.aria-expanded]="sidebarExpanded"
        [attr.data-open]="sidebarExpanded ? 'true' : 'false'"
        aria-controls="app-sidebar"
        class="hdr-burger min-mobile:hidden">
        <span class="hdr-burger__bar" aria-hidden="true"></span>
        <span class="hdr-burger__bar" aria-hidden="true"></span>
        <span class="hdr-burger__bar" aria-hidden="true"></span>
    </button>

    <!-- ELEVATOR wordmark — left on desktop, centered on mobile.
         The mark itself lives in elv-wordmark so the Create workspace can
         mount the same one in its toolbar. -->
    <elv-wordmark
        class="max-mobile:absolute max-mobile:left-1/2 max-mobile:top-1/2 max-mobile:-translate-x-1/2 max-mobile:-translate-y-1/2" />
</div>
