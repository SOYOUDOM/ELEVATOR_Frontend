<!-- The workspace's only bar. The app header is hidden in workspace mode
     (styles/_workspace.scss), so the wordmark lives here — the same
     elv-wordmark the site header mounts, not a second copy. -->
<div class="tb__brand">
    <elv-wordmark scale="1.15rem" logoClass="h-5 w-auto" />
</div>

<div class="tb__center">
    <elv-field
        density="compact"
        labelMode="hidden"
        label="CV name"
        icon="pi-file"
        width="260px"
        [value]="document()?.name ?? ''"
        (valueChange)="setName($event)" />

    <!-- The failure reason lives on the chip's tooltip, not as a sentence in
         the toolbar: spelled out inline it added ~230px to this group, pushed
         the actions leftwards and left the zoom button sitting on top of the
         Retry button. The chip already says what happened. -->
    <p
        class="tb__save"
        [attr.data-tone]="save().tone"
        [attr.title]="saveErrorMessage() || null"
        role="status"
        aria-live="polite">
        <i class="pi {{ save().icon }}" aria-hidden="true"></i>
        <span>{{ save().label }}</span>
    </p>

    @if (saveErrorMessage()) {
        <app-elv-button
            size="small"
            corner="sharp"
            variant="ghost"
            title="Retry"
            icon="pi pi-refresh"
            [ariaLabel]="'Retry saving. ' + saveErrorMessage()"
            (clicked)="retry()" />
    }
</div>

<div class="tb__right">
    <div class="tb__zoom" role="group" aria-label="Preview zoom">
        <app-elv-button
            size="small"
            corner="sharp"
            variant="ghost"
            [iconOnly]="true"
            icon="pi pi-search-minus"
            ariaLabel="Zoom out"
            [disabled]="ui.effectivePreviewZoom() <= zoomLimits.min"
            (clicked)="ui.zoomPreview(-zoomLimits.step)" />
        <button
            type="button"
            class="tb__zoom-value"
            [attr.aria-label]="
                ui.previewZoomMode() === 'fit' ? 'Zoom: fit to window. Reset to 100%' : 'Zoom. Fit to window'
            "
            (click)="ui.previewZoomMode() === 'fit' ? ui.setPreviewZoom(100) : ui.fitPreview()">
            {{ ui.effectivePreviewZoom() }}%
            @if (ui.previewZoomMode() === 'fit') {
                <span class="tb__zoom-tag">FIT</span>
            }
        </button>
        <app-elv-button
            size="small"
            corner="sharp"
            variant="ghost"
            [iconOnly]="true"
            icon="pi pi-search-plus"
            ariaLabel="Zoom in"
            [disabled]="ui.effectivePreviewZoom() >= zoomLimits.max"
            (clicked)="ui.zoomPreview(zoomLimits.step)" />
    </div>

    <app-elv-button
        size="small"
        corner="sharp"
        variant="ghost"
        icon="pi pi-database"
        [iconOnly]="compact()"
        [title]="compact() ? '' : profileSaveState() === 'saved' ? 'Saved to profile' : 'Save my information'"
        [loading]="profileSaveState() === 'saving'"
        ariaLabel="Save this information to my reusable profile"
        (clicked)="saveToProfile.emit()" />

    <app-elv-button
        size="small"
        corner="sharp"
        variant="ghost"
        icon="pi pi-eye"
        [iconOnly]="compact()"
        [title]="compact() ? '' : 'Preview'"
        ariaLabel="Clean preview"
        [selected]="cleanPreview()"
        (clicked)="toggleClean.emit()" />

    <app-elv-button
        size="small"
        corner="sharp"
        variant="primary"
        icon="pi pi-download"
        title="Export CV"
        ariaLabel="Export CV"
        (clicked)="exportCv.emit()" />
</div>
