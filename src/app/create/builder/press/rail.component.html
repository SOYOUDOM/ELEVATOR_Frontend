<div class="pane__head">
  <span class="label">Composer</span>
</div>

<!-- The readiness ring. One number, and immediately under it the next test
     it has not passed — a score you cannot act on is decoration. -->
<app-elv-ring class="ready"
              [value]="ready().pct"
              [title]="ready().done + ' of ' + ready().total + ' checks'"
              [caption]="nextGap() ? 'Next: ' + nextGap().toLowerCase() : 'Nothing outstanding'">
</app-elv-ring>

<div class="pane__body">
  <ul class="sections">
    @for (sec of doc().sections; track sec.id) {
      <li>
        <button class="sec" [class.is-hidden]="!sec.visible"
                [attr.aria-current]="sel().sec === sec.id && sel().item === null"
                (click)="select(sec.id, null)">
          <span class="sec__grip" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor"
                 stroke-width="1.6" stroke-linecap="round">
              <path d="M6 4h.01M10 4h.01M6 8h.01M10 8h.01M6 12h.01M10 12h.01"/>
            </svg>
          </span>
          <span class="sec__name">{{ sec.title }}</span>
          <span class="sec__count num">{{ sec.items.length || '' }}</span>
          <span class="sec__eye" role="button" [attr.aria-label]="sec.visible ? 'Hide' : 'Show'"
                (click)="toggle(sec.id, $event)">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
              @if (sec.visible) {
                <path d="M1 8s2.6-4.5 7-4.5S15 8 15 8s-2.6 4.5-7 4.5S1 8 1 8Z"/><circle cx="8" cy="8" r="1.9"/>
              } @else {
                <path d="M6.3 3.7A6.9 6.9 0 0 1 8 3.5C12.4 3.5 15 8 15 8a12 12 0 0 1-2.2 2.7M4.2 4.9A12 12 0 0 0 1 8s2.6 4.5 7 4.5c.8 0 1.5-.1 2.2-.4M2 2l12 12"/>
              }
            </svg>
          </span>
        </button>

        @if (sec.items.length) {
          <ul class="items">
            @for (it of sec.items; track $index) {
              <li>
                <button class="elv-cv-item"
                        [attr.aria-current]="sel().sec === sec.id && sel().item === $index"
                        (click)="select(sec.id, $index)">
                  @if (flagged(sec.id, $index)) { <i class="flag"></i> }
                  <span>{{ label(sec, $index) || 'Untitled' }}</span>
                  <em>{{ when(sec, $index) }}</em>
                </button>
              </li>
            }
          </ul>
        }
      </li>
    }
  </ul>

  <div class="addbar">
    <button class="elv-cv-btn elv-cv-btn--sm" (click)="add('experience')">+ Role</button>
    <button class="elv-cv-btn elv-cv-btn--sm" (click)="add('education')">+ Study</button>
    <button class="elv-cv-btn elv-cv-btn--sm" (click)="add('projects')">+ Project</button>
  </div>
</div>
