<div class="elv-flow">

  <!-- ══ THE SHAFT ═══════════════════════════════════════════
       Wizard nav as a lift shaft: the car rides the rail and each
       floor lights its tick as it completes. The car carries its
       own view-transition-name (see _create.scss) so its group
       morphs between floors and the lift visibly travels. -->
  <aside class="elv-shaft">
    <div class="elv-shaft__head">
      <div class="elv-shaft__title">Building progress</div>
      <div class="elv-shaft__pct">{{ percent() }}<span>%</span></div>
    </div>

    <ul class="elv-shaft__list">
      <div class="elv-shaft__car" [style.top.px]="9 + currentIndex() * 52" aria-hidden="true"></div>
      @for (f of floors; track f.id) {
        <li>
          <button type="button" class="elv-shaft__row"
                  [attr.data-done]="done()[f.id] ? 1 : 0"
                  [attr.aria-current]="f.id === current() ? 'step' : null"
                  (click)="go(f.id)">
            <span class="elv-shaft__num">{{ f.num }}</span>
            <span class="elv-shaft__name">{{ f.nav }}</span>
            <span class="elv-shaft__tick" aria-hidden="true">&#10003;</span>
          </button>
        </li>
      }
    </ul>

    <div class="elv-shaft__foot">
      <app-elv-button size="small" corner="sharp" variant="ghost" title="Preview"
                      [customClass]="ui.dock() ? 'is-on' : ''"
                      ariaLabel="Toggle the live preview"
                      (clicked)="ui.toggleDock()" />
      <app-elv-button size="small" corner="sharp" variant="ghost" title="6-sec"
                      [customClass]="ui.sixSecond() ? 'is-on' : ''"
                      ariaLabel="Toggle the six-second recruiter scan"
                      (clicked)="ui.toggleSixSecond()" />
    </div>
  </aside>

  <!-- ══ THE FLOOR ═══════════════════════════════════════════ -->
  <div class="elv-stage" [class.elv-stage--wide]="ui.dock() && !dockVisible()">
    <router-outlet />
  </div>

  <!-- ══ LIVE PREVIEW ════════════════════════════════════════
       Scaled by a transform with a deterministic factor, so the
       sheet is never measured after the view-transition snapshot
       is taken — measuring late is what makes a preview pop. -->
  <aside class="elv-dock" [class.elv-dock--off]="!dockVisible()">
    @if (dockVisible()) {
      <div class="elv-dock__bar">
        <span class="elv-dock__t">Live preview</span>
        <a class="elv-dock__full" [routerLink]="['/app/create/review']">Full view</a>
      </div>
      <div class="elv-dock__vp">
        <app-cv-sheet [scale]="dockScale" [sixSecond]="ui.sixSecond()" />
      </div>
    }
  </aside>

</div>
