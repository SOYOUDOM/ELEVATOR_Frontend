<header class="elv-floor-head">
  <span class="elv-eyebrow">{{ eyebrow() }}</span>
  <h2>{{ floor().title }}<br /><span class="elv-glow-text">{{ floor().glow }}</span></h2>
  <p class="elv-floor-lede">{{ floor().lede }}</p>
</header>

<ng-content />

@if (showRail()) {
  <div class="elv-rail">
    @if (prev(); as p) {
      <app-elv-button variant="ghost" corner="sharp" [title]="p.nav"
                      icon="pi pi-arrow-left" iconPos="left" (clicked)="go(p.id)" />
    } @else {
      <span></span>
    }

    <p class="elv-rail__hint">{{ hint() }}</p>

    @if (next(); as n) {
      <app-elv-button variant="neon" corner="sharp" [glow]="canContinue()" [disabled]="!canContinue()"
                      [title]="n.nav" icon="pi pi-arrow-right" iconPos="right" [iconGap]="18"
                      (clicked)="go(n.id)" />
    } @else {
      <span></span>
    }
  </div>
}
