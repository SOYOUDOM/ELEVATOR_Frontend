<app-header></app-header>

<div class="elv-page scene relative flex w-full min-h-0! h-[calc(100dvh-var(--p-elevator-navbar-height))] p-0! w-full!">
    <!-- ── LEFT · brand panel ─────────────────────────────────── -->
    <div class="w-1/2 relative overflow-hidden max-mobile:hidden">

        <!-- backdrop -->
        <div class="absolute inset-0 bg-cover bg-bottom bg-no-repeat"
            style="background-image: url('./assets/img/earth+star-field.png');">
        </div>

        <!-- ── copy stack ── -->
        <div class="relative h-full flex flex-col justify-center
                    gap-[clamp(1.5rem,3vh,2.75rem)]
                    px-[clamp(2rem,6vw,5rem)] py-[clamp(2rem,5vh,4rem)]">
            <div class="absolute inset-0 flex items-center justify-center z-10 pointer-events-none">
                <span class="elv-logo-fx"></span>
            </div>

            <h1 class="elv-reveal uppercase font-semibold
                       text-[clamp(1.6rem,3.2vw,3rem)] leading-[1.18] tracking-[0.14em]
                       text-[var(--p-elevator-ink)]" style="animation-delay:.3s">
                Continue<br />
                Building<br />
                Your <span class="text-[var(--p-elevator-accent)]
                                  drop-shadow-[0_0_18px_var(--p-elevator-accent-glow)]">Future.</span>
            </h1>
            <div
                class="w-[5%] min-w-[36px] h-[3px] shrink-0 drop-shadow-[0_0_18px_var(--p-elevator-accent-glow)] rounded-[5px] bg-[var(--p-elevator-accent)] elv-reveal">
            </div>
            <p class="elv-reveal max-w-[34ch] leading-relaxed
                      text-[clamp(.8rem,1.05vw,1rem)] text-[var(--p-elevator-ink2)]" style="animation-delay:.45s">
                Sign in to access your workspace<br />
                and keep elevating your career.
            </p>
        </div>

        <p class="absolute bottom-6 left-6 elv-reveal max-w-[34ch] leading-relaxed
                      text-[clamp(.8rem,1.05vw,1rem)] text-[var(--p-elevator-ink2)]" style="animation-delay:.6s">© 2026 ELEVATOR. All rights reserved.</p>
    </div>

    <!-- seam: hairline divider + a single 2s light run. Absolute, so it
         costs the two panels nothing. -->
    <span class="elv-seam elv-seam--scan" style="--elv-seam-dur:6s;  --elv-seam-delay:.35s" aria-hidden="true"></span>

    <!-- ── RIGHT · Sign/Log in panel ─────────────────────────────────── -->
    <div class="w-1/2 relative overflow-hidden p-10">
        <p class="uppercase elv-reveal [text-shadow:0_0_8px_var(--p-elevator-accent-glow),0_0_20px_var(--p-elevator-accent-glow),0_0_45px_var(--p-elevator-accent-glow)] text-[var(--p-elevator-accent)]"
            style="animation-delay:.25s" elvReveal="wipe">Welcome back</p>
        <p class="uppercase elv-reveal text-7xl mt-6!" style="animation-delay:.25s" elvReveal="wipe">Sign In</p>
        <!-- Input Section -->
        <div class="mt-10 w-full h-[50%] flex flex-col gap-6 p-6">
            <!-- <elv-field label="Email"    icon="pi pi-user" placeholder="Enter your email"
           type="email" labelMode="stacked" corner="sharp" />

<elv-field label="Password" icon="pi pi-lock" placeholder="Enter your password"
           type="password" [revealable]="true" labelMode="stacked" corner="sharp" /> -->
            <elv-field preset="auth-email" class="elv-reveal" [height]="70" skin="raised" skin="minimal"
                elvReveal="wipe" /> <!-- opt back out -->
            <elv-field preset="auth-password" class="elv-reveal" [height]="70" corner="sharp" elvReveal="glitch" />
            <!-- still tunable -->
            <div class="flex justify-between items-center gap-2 flex">
                <elv-checkbox label="Remember me" [(checked)]="rememberMe" [inputClass]="'border-4 border-white!'"
                    labelClass="text-white text-[var(--p-elevator-ink2)] uppercase font-semibold!" />
                <a class="text-[var(--p-elevator-accent)]! hover:[text-shadow:0_0_8px_var(--p-elevator-accent-glow),0_0_20px_var(--p-elevator-accent-glow),0_0_45px_var(--p-elevator-accent-glow)]! text-[var(--p-elevator-ink2)] uppercase font-semibold transition-colors duration-300"
                    href="#forgotpassword">Forgot password?</a>
            </div>
            <app-elv-button elvReveal="left" variant="neon" icon="pi pi-arrow-right" iconPos="right" [iconGap]="28" [size]="'large'"
                customClass="elv-btn--scan w-full " [corner]="'round'" [title]="'Sign In'" (click)="onSignInClick()">
            </app-elv-button>
            <div class="flex items-center gap-3 text-sm text-[var(--p-elevator-ink2)] uppercase font-semibold
            before:flex-1 before:h-px before:bg-white/20
            after:flex-1 after:h-px after:bg-white/20">
                <span elvReveal="wipe">or</span>
            </div>
            <div class="grid grid-cols-2 gap-3 w-full">
                <app-elv-button icon="fa-brands fa-google" [iconGap]="28" [size]="'large'"
                    customClass="elv-btn--scan w-full uppercase font-semibold!" [corner]="'round'" [title]="'Continue With Google'" (click)="onSignInClick()" elvReveal="doors">
                </app-elv-button>

                <app-elv-button icon="fa-brands fa-github fa-float" iconPos="right" [iconGap]="28" [size]="'large'"
                    customClass="elv-btn--scan w-full uppercase font-semibold!" [corner]="'notch'" [title]="'Continue With GitHub'" elvReveal="zoom" (click)="onSignInClick()">
                </app-elv-button>
            </div>
        </div>
